sql.resumo.saveAll=INSERT INTO resumo_registro (upload_id, registro, total) VALUES (:uploadId, :registro, :total)
sql.resumo.findByUploadId=SELECT id, upload_id, registro, total FROM resumo_registro WHERE upload_id = :uploadId ORDER BY registro
sql.upload.save=INSERT INTO upload (id, status) VALUES (:id, 'EM_PROCESSAMENTO')
sql.upload.findById=SELECT id, status, created_at FROM upload WHERE id = :id
sql.upload.updateStatus=UPDATE upload SET status = :status WHERE id = :id
