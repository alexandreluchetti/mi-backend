spring:
  application:
    name: mi-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/mibackend
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

security:
  tokens:
    envio: "token-envio-secreto"
    consulta: "token-consulta-secreto"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    default-model-expand-depth: 3
  api-docs:
    path: /v3/api-docs
  show-actuator: false

