spring:
  datasource:
    url: jdbc:h2:mem:mibackend;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  flyway:
    enabled: false # Desabilitado em teste para evitar conflito de dialeto Postgres no H2
  
  sql:
    init:
      mode: always # Usa schema.sql para inicializar o H2

server:
  port: 0
